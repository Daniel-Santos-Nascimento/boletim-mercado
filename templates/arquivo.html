{% extends "base.html" %}
{% block titulo %}Arquivo | {{ cfg.nome }}{% endblock %}
{% block conteudo %}
<div class="wrap pagina">
<section class="capa"><h1>Todos os boletins</h1></section>
<section class="bloco">
  <ul class="lista-arquivo">
  {% for d in arquivo %}
    <li><a href="{{ raiz }}boletim/{{ d }}/index.html">{{ d | data_longa | capitalize }}</a></li>
  {% endfor %}
  </ul>
</section>
</div>
{% endblock %}
